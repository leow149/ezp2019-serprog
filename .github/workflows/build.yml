name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDCC + binutils
        run: sudo apt-get update && sudo apt-get install -y sdcc binutils

      - name: Build firmware
        run: make

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ezp2019-serprog
          path: ezp2019-serprog.bin
          if-no-files-found: error